<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>LightingMod approvals</title>
<style>
:root{color-scheme:dark;--bg:#090e17;--panel:#121c2b;--line:#26364d;--muted:#91a2ba;--green:#55d6a0;--red:#ff7b83;--yellow:#f0c879}*{box-sizing:border-box}body{margin:0;min-height:100vh;background:radial-gradient(ellipse at 20% 0%,#1b2c49 0,transparent 48%),var(--bg);color:#edf3ff;font:15px/1.5 system-ui,Segoe UI,sans-serif}main{max-width:900px;margin:42px auto;padding:0 22px}.top{display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap;margin-bottom:22px}h1{font-size:26px;margin:0}.muted{color:var(--muted);font-size:13px}.panel{background:linear-gradient(180deg,#152235,#101824);border:1px solid var(--line);border-radius:16px;padding:20px;box-shadow:0 18px 50px #0003}.device{padding:16px;border:1px solid var(--line);border-radius:12px;background:#0d1521;margin:12px 0}.deviceHead{display:flex;justify-content:space-between;gap:12px;align-items:center;flex-wrap:wrap}.device strong{font-size:16px}.pill{border:1px solid var(--line);border-radius:999px;padding:5px 11px;font-size:12px}.approved{color:var(--green);border-color:#27684f}.denied{color:var(--red);border-color:#713943}.pending{color:var(--yellow);border-color:#75602e}.meta{margin-top:7px;color:var(--muted);font-size:13px}.empty{padding:24px;text-align:center;color:var(--muted)}#connection{color:var(--muted);font-size:12px}.foot{margin-top:18px;color:var(--muted);font-size:12px}
</style>
</head>
<body>
<main>
<header class="top"><div><h1>LightingMod</h1><div class="muted">Device approval status</div></div><span id="connection">Connecting to Firebase…</span></header>
<section class="panel"><h2>Connected Minecraft devices</h2><div id="devices"><div class="empty">Waiting for a device…</div></div></section>
<div class="foot">This page displays the latest approval decision submitted by each LightingMod client.</div>
</main>
<script type="module">
import {initializeApp} from 'https://www.gstatic.com/firebasejs/12.6.0/firebase-app.js';
import {getDatabase,ref,onValue} from 'https://www.gstatic.com/firebasejs/12.6.0/firebase-database.js';
import {firebaseConfig} from './firebase-config.js';
const app=initializeApp(firebaseConfig);
const db=getDatabase(app);
const devicesEl=document.getElementById('devices');
const connectionEl=document.getElementById('connection');
let devices={};
let approvals={};
function render(){
 const ids=new Set([...Object.keys(devices),...Object.keys(approvals)]);
 devicesEl.replaceChildren();
 if(!ids.size){const empty=document.createElement('div');empty.className='empty';empty.textContent='No Minecraft devices have connected yet.';devicesEl.append(empty);return;}
 for(const id of ids){
  const device=devices[id]||{};
  const approval=approvals[id]||{};
  const decision=(approval.decision||'pending').toLowerCase();
  const card=document.createElement('article');card.className='device';
  const head=document.createElement('div');head.className='deviceHead';
  const name=document.createElement('strong');name.textContent=device.name||'Minecraft PC';
  const status=document.createElement('span');status.className='pill '+(decision==='approved'?'approved':decision==='denied'?'denied':'pending');status.textContent=decision==='approved'?'Approved':decision==='denied'?'Denied':'Waiting for decision';
  head.append(name,status);
  const meta=document.createElement('div');meta.className='meta';
  const seen=device.lastSeen?new Date(device.lastSeen).toLocaleString():'Not reported';
  meta.textContent=`${device.platform||'Unknown platform'} · Minecraft ${device.minecraftVersion||'unknown'} · Last seen ${seen}`;
  const idLine=document.createElement('div');idLine.className='meta';idLine.textContent='Device ID: '+id;
  const changed=document.createElement('div');changed.className='meta';changed.textContent=approval.updatedAt?'Decision updated: '+new Date(approval.updatedAt).toLocaleString():'';
  card.append(head,meta,idLine,changed);devicesEl.append(card);
 }
}
onValue(ref(db,'devices'),snap=>{devices=snap.val()||{};render();connectionEl.textContent='Live';},err=>{connectionEl.textContent='Database error: '+err.message;});
onValue(ref(db,'approvals'),snap=>{approvals=snap.val()||{};render();},err=>{connectionEl.textContent='Database error: '+err.message;});
</script>
</body>
</html>
