
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>LightingMod Remote Desktop</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      padding: 24px;
      background: #101116;
      color: #f2f2f5;
      font-family: Arial, sans-serif;
    }

    h1, h2 {
      margin-top: 0;
    }

    .container {
      max-width: 1200px;
      margin: auto;
    }

    .panel {
      background: #191b23;
      border: 1px solid #30333f;
      border-radius: 12px;
      padding: 18px;
      margin-bottom: 18px;
    }

    .device {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 12px;
      padding: 14px;
      border-bottom: 1px solid #30333f;
    }

    .device:last-child {
      border-bottom: none;
    }

    button {
      background: #7357ff;
      border: none;
      color: white;
      padding: 10px 16px;
      border-radius: 7px;
      cursor: pointer;
      font-weight: bold;
    }

    button:hover {
      background: #876fff;
    }

    button:disabled {
      opacity: .5;
      cursor: not-allowed;
    }

    button.danger {
      background: #d94343;
    }

    button.danger:hover {
      background: #ed5555;
    }

    #viewer {
      display: none;
    }

    #screen {
      width: 100%;
      height: auto;
      max-height: 75vh;
      background: #000;
      border-radius: 8px;
      object-fit: contain;
      display: block;
      cursor: crosshair;
      touch-action: none;
      outline: none;
      user-select: none;
    }

    #screen::-webkit-media-controls,
    #screen::-webkit-media-controls-enclosure,
    #screen::-webkit-media-controls-panel {
      display: none !important;
    }

    #screen:fullscreen {
      width: 100vw;
      height: 100vh;
      max-height: none;
      object-fit: contain;
      background: #000;
      border-radius: 0;
      cursor: crosshair;
    }

    #status {
      color: #aaa;
      margin: 10px 0;
      overflow-wrap: anywhere;
    }

    #logs {
      height: 220px;
      overflow-y: auto;
      background: #0b0c10;
      border-radius: 8px;
      padding: 12px;
      font-family: Consolas, monospace;
      font-size: 12px;
      overflow-wrap: anywhere;
    }

    .log {
      margin-bottom: 6px;
      color: #c9c9d2;
    }

    .muted {
      color: #999;
      font-size: 13px;
    }

    .controls {
      display: flex;
      flex-wrap: wrap;
      gap: 10px;
      margin-bottom: 12px;
    }
  </style>
</head>

<body>
  <div class="container">
    <h1>LightingMod Remote Desktop</h1>

    <div class="panel">
      <h2>Devices</h2>
      <div id="devices">
        <p class="muted">Loading devices...</p>
      </div>
    </div>

    <div class="panel">
      <h2>Approvals</h2>
      <div id="approvals">
        <p class="muted">Loading approvals...</p>
      </div>
    </div>

    <div class="panel" id="viewer">
      <h2>Remote Desktop</h2>

      <div class="controls">
        <button id="fullscreenButton">Fullscreen</button>
        <button id="disconnectButton" class="danger">Disconnect</button>
      </div>

      <div id="status">Not connected</div>

      <video
        id="screen"
        autoplay
        playsinline
        tabindex="0"
        disablepictureinpicture
        disableremoteplayback
        controlslist="nodownload noremoteplayback"
      ></video>

      <p class="muted">
        Use the fullscreen button to expand the desktop.
        Press Escape to exit. Mouse and keyboard input are forwarded while connected.
      </p>
    </div>

    <div class="panel">
      <h2>Connection Logs</h2>
      <div id="logs"></div>
    </div>
  </div>

  <script type="module">
    import {
      initializeApp
    } from 'https://www.gstatic.com/firebasejs/12.6.0/firebase-app.js';

    import {
      getDatabase,
      ref,
      onValue,
      set,
      remove
    } from 'https://www.gstatic.com/firebasejs/12.6.0/firebase-database.js';

    import {
      firebaseConfig
    } from './firebase-config.js';

    const app = initializeApp(firebaseConfig);
    const db = getDatabase(app);

    const devicesElement = document.getElementById('devices');
    const approvalsElement = document.getElementById('approvals');
    const viewerElement = document.getElementById('viewer');
    const statusElement = document.getElementById('status');
    const screen = document.getElementById('screen');
    const logsElement = document.getElementById('logs');

    const disconnectButton = document.getElementById('disconnectButton');
    const fullscreenButton = document.getElementById('fullscreenButton');

    let devices = {};
    let approvals = {};

    let peer = null;
    let inputChannel = null;

    let activeId = null;
    let sessionId = null;

    let sessionListener = null;
    let sessionReference = null;

    let connecting = false;
    let stopping = false;

    function log(message) {
      const entry = document.createElement('div');
      entry.className = 'log';

      entry.textContent =
        '[' + new Date().toLocaleTimeString() + '] ' + message;

      logsElement.appendChild(entry);
      logsElement.scrollTop = logsElement.scrollHeight;

      console.log(message);
    }

    function setStatus(message) {
      statusElement.textContent = message;
      log('Status: ' + message);
    }

    function renderDevices() {
      devicesElement.replaceChildren();

      const entries = Object.entries(devices);

      if (entries.length === 0) {
        devicesElement.textContent = 'No devices found.';
        return;
      }

      for (const [id, device] of entries) {
        const row = document.createElement('div');
        row.className = 'device';

        const information = document.createElement('div');

        const name = document.createElement('strong');
        name.textContent = device.name || 'Unknown device';

        const identifier = document.createElement('div');
        identifier.className = 'muted';
        identifier.textContent = id;

        const deviceStatus = document.createElement('div');
        deviceStatus.className = 'muted';
        deviceStatus.textContent = device.status || 'Available';

        information.append(name, identifier, deviceStatus);

        const button = document.createElement('button');
        button.textContent = 'Connect';
        button.disabled = !approvals[id] || connecting;

        button.addEventListener('click', () => {
          startViewer(id);
        });

        row.append(information, button);
        devicesElement.appendChild(row);
      }
    }

    function renderApprovals() {
      approvalsElement.replaceChildren();

      const entries = Object.entries(approvals);
      let found = false;

      if (entries.length === 0) {
        approvalsElement.textContent = 'No approved devices.';
        return;
      }

      for (const [id, approval] of entries) {
        if (!approval || approval.approved !== true) {
          continue;
        }

        found = true;

        const row = document.createElement('div');
        row.className = 'device';

        const information = document.createElement('div');

        const name = document.createElement('strong');
        name.textContent = devices[id]?.name || 'Approved device';

        const identifier = document.createElement('div');
        identifier.className = 'muted';
        identifier.textContent = id;

        information.append(name, identifier);
        row.appendChild(information);

        approvalsElement.appendChild(row);
      }

      if (!found) {
        approvalsElement.textContent = 'No approved devices.';
      }
    }

    onValue(ref(db, 'devices'), snapshot => {
      devices = snapshot.val() || {};

      log('Firebase devices listener updated.');

      renderDevices();
      renderApprovals();
    }, error => {
      log('Device listener error: ' + error.message);
    });

    onValue(ref(db, 'approvals'), snapshot => {
      approvals = snapshot.val() || {};

      log('Firebase approvals listener updated.');

      renderDevices();
      renderApprovals();
    }, error => {
      log('Approval listener error: ' + error.message);
    });

    async function waitForIceGathering(connection) {
      if (connection.iceGatheringState === 'complete') {
        log('ICE gathering already completed.');
        return;
      }

      return new Promise(resolve => {
        let finished = false;
        let timeout;

        function cleanup() {
          clearTimeout(timeout);
          connection.removeEventListener('icegatheringstatechange', changed);
        }

        function finish() {
          if (finished) return;

          finished = true;
          cleanup();
          resolve();
        }

        function changed() {
          log('ICE gathering state: ' + connection.iceGatheringState);

          if (connection.iceGatheringState === 'complete') {
            log('ICE gathering completed.');
            finish();
          }
        }

        timeout = setTimeout(() => {
          log('ICE gathering timed out. Continuing with available candidates.');
          finish();
        }, 20000);

        connection.addEventListener('icegatheringstatechange', changed);
        changed();
      });
    }

    async function startViewer(id) {
      if (connecting) return;

      await stopViewer();

      connecting = true;
      renderDevices();

      activeId = id;
      viewerElement.style.display = 'block';

      log('Starting viewer for device ' + id);

      try {
        await connectViewer();
      } catch (error) {
        log('Connection setup failed: ' + error.message);
        setStatus(error.message);
        await stopViewer();
      } finally {
        connecting = false;
        renderDevices();
      }
    }

    async function connectViewer() {
      sessionId = crypto.randomUUID();

      log('Session ID: ' + sessionId);
      setStatus('Creating secure WebRTC connection…');

      peer = new RTCPeerConnection({
        iceServers: [
          {
            urls: 'stun:stun.l.google.com:19302'
          }
        ]
      });

      peer.addTransceiver('video', {
        direction: 'recvonly'
      });

      inputChannel = peer.createDataChannel('remote-input', {
        ordered: true
      });

      inputChannel.onopen = () => {
        log('Remote input channel opened.');
        setStatus('LIVE - Remote desktop connected.');
      };

      inputChannel.onclose = () => {
        log('Remote input data channel closed.');

        if (!stopping) {
          setStatus('Remote input channel closed.');
        }
      };

      inputChannel.onerror = error => {
        log('Data channel error: ' + error);
      };

      peer.ontrack = event => {
        log('Remote video track received.');

        screen.srcObject = event.streams[0];

        screen.play().catch(error => {
          log('Video playback error: ' + error.message);
        });
      };

      peer.onicecandidate = event => {
        if (event.candidate) {
          log('Local ICE candidate gathered.');
        } else {
          log('Local ICE candidate gathering finished.');
        }
      };

      peer.onicegatheringstatechange = () => {
        log('ICE gathering state: ' + peer.iceGatheringState);
      };

      peer.oniceconnectionstatechange = () => {
        log('ICE connection state: ' + peer.iceConnectionState);
      };

      peer.onconnectionstatechange = () => {
        log('Connection state: ' + peer.connectionState);

        if (peer.connectionState === 'connected') {
          setStatus('WebRTC connected. Waiting for video...');
        }

        if (
          peer.connectionState === 'failed' ||
          peer.connectionState === 'disconnected' ||
          peer.connectionState === 'closed'
        ) {
          if (!stopping) {
            setStatus('Connection ' + peer.connectionState + '.');
          }
        }
      };

      const offer = await peer.createOffer();
      await peer.setLocalDescription(offer);

      log('Local offer created. Gathering ICE candidates.');

      await waitForIceGathering(peer);

      if (!peer || !activeId || !sessionId) {
        throw new Error('Connection was cancelled.');
      }

      const offerData = {
        type: peer.localDescription.type,
        sdp: peer.localDescription.sdp
      };

      log('Publishing offer to Firebase.');

      sessionReference = ref(db, 'sessions/' + activeId);

      await set(sessionReference, {
        sessionId: sessionId,
        offer: offerData,
        status: 'offering',
        createdAt: Date.now()
      });

      log('Offer published to Firebase.');

      sessionListener = onValue(sessionReference, async snapshot => {
        const data = snapshot.val();

        if (!data) {
          log('Session removed from Firebase.');
          return;
        }

        if (data.sessionId !== sessionId) return;

        if (data.error) {
          log('Device error: ' + data.error);
          setStatus('Device error: ' + data.error);
          return;
        }

        if (
          data.answer &&
          peer &&
          peer.signalingState === 'have-local-offer'
        ) {
          try {
            log('Remote answer received.');

            await peer.setRemoteDescription(
              new RTCSessionDescription(data.answer)
            );

            log('Remote answer applied.');
            setStatus('Answer received. Establishing connection...');
          } catch (error) {
            log('Failed to apply answer: ' + error.message);
            setStatus('Failed to apply answer.');
          }
        }

        if (data.status) {
          log('Device status: ' + data.status);
        }
      }, error => {
        log('Session listener error: ' + error.message);
      });
    }

    async function stopViewer() {
      stopping = true;

      const oldId = activeId;
      const oldSessionId = sessionId;
      const oldPeer = peer;
      const oldChannel = inputChannel;
      const oldReference = sessionReference;
      const oldListener = sessionListener;

      activeId = null;
      sessionId = null;
      peer = null;
      inputChannel = null;
      sessionReference = null;
      sessionListener = null;

      if (oldReference && oldListener) {
        oldListener();
      }

      if (oldChannel) {
        try {
          oldChannel.close();
        } catch (error) {
          log('Data channel close error: ' + error.message);
        }
      }

      if (oldPeer) {
        try {
          oldPeer.close();
        } catch (error) {
          log('Peer close error: ' + error.message);
        }
      }

      releasePointer();

      screen.srcObject = null;
      viewerElement.style.display = 'none';

      if (oldId && oldSessionId) {
        try {
          await remove(ref(db, 'sessions/' + oldId));
          log('Firebase session removed.');
        } catch (error) {
          log('Could not remove Firebase session: ' + error.message);
        }
      }

      stopping = false;
    }

    async function toggleFullscreen() {
      try {
        if (document.fullscreenElement) {
          await document.exitFullscreen();
        } else {
          await screen.requestFullscreen();
          log('Remote desktop entered fullscreen.');
        }
      } catch (error) {
        log('Fullscreen failed: ' + error.message);
      }
    }

    fullscreenButton.addEventListener('click', toggleFullscreen);

    document.addEventListener('fullscreenchange', () => {
      fullscreenButton.textContent =
        document.fullscreenElement ? 'Exit Fullscreen' : 'Fullscreen';
    });

    disconnectButton.addEventListener('click', async () => {
      log('Disconnect requested.');

      if (document.fullscreenElement) {
        await document.exitFullscreen();
      }

      await stopViewer();

      setStatus('Disconnected.');
      renderDevices();
    });

    function sendInput(data) {
      if (
        inputChannel &&
        inputChannel.readyState === 'open'
      ) {
        inputChannel.send(JSON.stringify(data));
      }
    }

    function getScreenCoordinates(event) {
      const bounds = screen.getBoundingClientRect();

      const videoWidth = screen.videoWidth;
      const videoHeight = screen.videoHeight;

      if (!videoWidth || !videoHeight) {
        return null;
      }

      const scale = Math.min(
        bounds.width / videoWidth,
        bounds.height / videoHeight
      );

      const renderedWidth = videoWidth * scale;
      const renderedHeight = videoHeight * scale;

      const offsetX = (bounds.width - renderedWidth) / 2;
      const offsetY = (bounds.height - renderedHeight) / 2;

      const x = (event.clientX - bounds.left - offsetX) / renderedWidth;
      const y = (event.clientY - bounds.top - offsetY) / renderedHeight;

      if (x < 0 || x > 1 || y < 0 || y > 1) {
        return null;
      }

      return { x, y };
    }

    function releasePointer() {
      if (screen.hasPointerCapture?.(activePointerId)) {
        try {
          screen.releasePointerCapture(activePointerId);
        } catch (error) {
          log('Pointer release error: ' + error.message);
        }
      }

      activePointerId = null;
    }

    let activePointerId = null;
    const pressedButtons = new Set();

    screen.addEventListener('pointerdown', event => {
      event.preventDefault();

      if (activePointerId !== null) return;

      activePointerId = event.pointerId;

      try {
        screen.setPointerCapture(event.pointerId);
      } catch (error) {
        log('Pointer capture unavailable: ' + error.message);
      }

      screen.focus();

      const position = getScreenCoordinates(event);
      if (!position) return;

      pressedButtons.add(event.button);

      sendInput({
        type: 'mouseDown',
        button: event.button,
        x: position.x,
        y: position.y
      });
    });

    screen.addEventListener('pointermove', event => {
      const position = getScreenCoordinates(event);
      if (!position) return;

      sendInput({
        type: 'mouseMove',
        x: position.x,
        y: position.y
      });
    });

    screen.addEventListener('pointerup', event => {
      event.preventDefault();

      const position = getScreenCoordinates(event);

      if (position && pressedButtons.has(event.button)) {
        sendInput({
          type: 'mouseUp',
          button: event.button,
          x: position.x,
          y: position.y
        });
      }

      pressedButtons.delete(event.button);

      if (activePointerId === event.pointerId) {
        releasePointer();
      }
    });

    screen.addEventListener('pointercancel', () => {
      releaseAllButtons();
    });

    screen.addEventListener('lostpointercapture', () => {
      releaseAllButtons();
    });

    function releaseAllButtons() {
      for (const button of pressedButtons) {
        sendInput({
          type: 'mouseUp',
          button,
          x: 0.5,
          y: 0.5
        });
      }

      pressedButtons.clear();
      activePointerId = null;
    }

    screen.addEventListener('contextmenu', event => {
      event.preventDefault();
    });

    screen.addEventListener('wheel', event => {
      event.preventDefault();

      sendInput({
        type: 'scroll',
        deltaX: event.deltaX,
        deltaY: event.deltaY
      });
    }, { passive: false });

    document.addEventListener('keydown', event => {
      if (!activeId || !inputChannel || inputChannel.readyState !== 'open') {
        return;
      }

      if (
        ['INPUT', 'TEXTAREA'].includes(document.activeElement?.tagName)
      ) {
        return;
      }

      event.preventDefault();

      sendInput({
        type: 'keyDown',
        key: event.key,
        code: event.code,
        keyCode: event.keyCode
      });
    });

    document.addEventListener('keyup', event => {
      if (!activeId || !inputChannel || inputChannel.readyState !== 'open') {
        return;
      }

      event.preventDefault();

      sendInput({
        type: 'keyUp',
        key: event.key,
        code: event.code,
        keyCode: event.keyCode
      });
    });

    window.addEventListener('blur', () => {
      releaseAllButtons();
    });

    window.addEventListener('beforeunload', () => {
      if (activeId) {
        remove(ref(db, 'sessions/' + activeId));
      }

      if (peer) {
        peer.close();
      }
    });

    log('Dashboard initialized.');
  </script>
</body>
</html>
